<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Welder's Dog — Staff Challenge</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e8a838;
    --accent2: #d4762c;
    --green: #4ecca3;
    --red: #e74c3c;
    --text: #eee;
    --muted: #8899aa;
    --badge-locked: #2a2a4a;
    --badge-earned: #2d6a4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* Header */
  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 {
    font-size: 1.6em;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header .subtitle {
    color: var(--muted);
    font-size: 0.85em;
    margin-top: 4px;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: var(--card);
    border-radius: 12px;
    padding: 14px 8px;
    margin: 12px 0;
  }
  .stat { text-align: center; }
  .stat .val { font-size: 1.4em; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 0.7em; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* Rank display */
  .rank-display {
    text-align: center;
    padding: 8px;
    margin-bottom: 12px;
  }
  .rank-title {
    font-size: 1.1em;
    font-weight: 700;
    color: var(--green);
  }
  .rank-progress {
    height: 6px;
    background: var(--card);
    border-radius: 3px;
    margin: 8px 40px;
    overflow: hidden;
  }
  .rank-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* Badge grid */
  .badge-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0;
  }
  .badge-card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .badge-card:active { transform: scale(0.96); }
  .badge-card.earned { border-color: var(--green); }
  .badge-card.earned::after {
    content: '✓';
    position: absolute;
    top: 8px; right: 10px;
    color: var(--green);
    font-size: 1.1em;
    font-weight: 700;
  }
  .badge-icon { font-size: 2.2em; margin-bottom: 6px; }
  .badge-name { font-size: 0.85em; font-weight: 600; }
  .badge-score { font-size: 0.7em; color: var(--muted); margin-top: 4px; }

  /* Challenge mode button */
  .challenge-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 14px;
    color: #1a1a2e;
    font-size: 1.05em;
    font-weight: 700;
    cursor: pointer;
    margin: 12px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.2s;
  }
  .challenge-btn:active { transform: scale(0.97); }
  .challenge-btn .sub { font-size: 0.7em; font-weight: 400; text-transform: none; letter-spacing: 0; display: block; margin-top: 2px; }

  /* Quiz screen */
  .quiz-screen { display: none; }
  .quiz-screen.active { display: block; }
  .home-screen.active { display: block; }
  .home-screen { display: none; }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 1.4em;
    cursor: pointer;
    padding: 4px 8px;
  }
  .quiz-badge-name { font-weight: 600; font-size: 0.95em; }
  .quiz-progress-text { font-size: 0.8em; color: var(--muted); }

  .progress-bar {
    height: 5px;
    background: var(--card);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* Streak display */
  .streak-display {
    text-align: center;
    margin-bottom: 14px;
    min-height: 28px;
  }
  .streak-display span {
    background: var(--card);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8em;
    color: var(--accent);
    font-weight: 600;
  }
  .streak-display .hot {
    background: linear-gradient(135deg, #e74c3c, #e8a838);
    color: #fff;
    animation: pulse 0.6s ease infinite alternate;
  }
  @keyframes pulse { to { transform: scale(1.05); } }

  /* Question */
  .question-text {
    font-size: 1.05em;
    line-height: 1.5;
    margin-bottom: 20px;
    min-height: 60px;
  }
  .question-type-label {
    display: inline-block;
    font-size: 0.65em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    background: rgba(232,168,56,0.15);
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  /* Answer options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 0.92em;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.selected { border-color: var(--accent); }
  .option-btn.correct { border-color: var(--green); background: rgba(78,204,163,0.15); }
  .option-btn.wrong { border-color: var(--red); background: rgba(231,76,60,0.15); }
  .option-btn:disabled { cursor: default; opacity: 0.85; }

  /* Feedback */
  .feedback {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    font-size: 0.88em;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; animation: slideUp 0.3s ease; }
  .feedback.correct-fb { background: rgba(78,204,163,0.12); border-left: 3px solid var(--green); }
  .feedback.wrong-fb { background: rgba(231,76,60,0.12); border-left: 3px solid var(--red); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .next-btn {
    display: none;
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #1a1a2e;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
  }
  .next-btn.show { display: block; }

  /* Results screen */
  .results-screen { display: none; text-align: center; padding: 30px 0; }
  .results-screen.active { display: block; animation: slideUp 0.4s ease; }
  .results-icon { font-size: 4em; margin-bottom: 12px; }
  .results-title { font-size: 1.4em; font-weight: 700; margin-bottom: 8px; }
  .results-subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.9em; }
  .results-score {
    font-size: 2.5em;
    font-weight: 800;
    color: var(--accent);
    margin: 16px 0;
  }
  .results-detail { color: var(--muted); font-size: 0.85em; margin-bottom: 20px; }
  .badge-unlocked {
    background: rgba(78,204,163,0.15);
    border: 2px solid var(--green);
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
    animation: pulse 0.8s ease 2;
  }
  .badge-unlocked .badge-icon { font-size: 3em; }
  .badge-unlocked h3 { color: var(--green); margin-top: 8px; }

  .result-btns { display: flex; gap: 10px; margin-top: 20px; }
  .result-btns button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-retry { background: var(--card); color: var(--text); }
  .btn-home { background: var(--accent); color: #1a1a2e; }

  /* Reset link */
  .reset-link {
    text-align: center;
    margin: 24px 0 12px;
  }
  .reset-link a {
    color: var(--muted);
    font-size: 0.75em;
    text-decoration: none;
    cursor: pointer;
  }

  /* Animations */
  .points-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2em;
    font-weight: 800;
    color: var(--accent);
    pointer-events: none;
    animation: pointsFly 0.8s ease forwards;
    z-index: 100;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  @keyframes pointsFly {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
  }
</style>
</head>
<body>

<div class="container">

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="home-screen active">
    <div class="header">
      <h1>🐕 The Welder's Dog</h1>
      <div style="font-size:1.3em; font-weight:700; margin-top:4px;">Staff Challenge</div>
      <div class="subtitle">How well do you know the Dog?</div>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="val" id="totalPoints">0</div><div class="lbl">Points</div></div>
      <div class="stat"><div class="val" id="badgesEarned">0/6</div><div class="lbl">Badges</div></div>
      <div class="stat"><div class="val" id="bestStreak">0</div><div class="lbl">Best Streak</div></div>
    </div>

    <div class="rank-display">
      <div class="rank-title" id="rankTitle">🧹 Glass Collector</div>
      <div class="rank-progress"><div class="rank-progress-fill" id="rankFill" style="width:0%"></div></div>
    </div>

    <div class="badge-grid" id="badgeGrid"></div>

    <button class="challenge-btn" onclick="startChallenge()">
      ⚡ Random Challenge
      <span class="sub">10 questions from across all topics</span>
    </button>

    <div class="reset-link"><button onclick="resetProgress()" style="background:none;border:none;color:#8899aa;font-size:0.75em;cursor:pointer;padding:8px 16px;">Reset all progress</button></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="quiz-screen">
    <div class="quiz-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="quiz-badge-name" id="quizBadgeName"></span>
      <span class="quiz-progress-text" id="quizProgressText"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quizProgressBar"></div></div>
    <div class="streak-display" id="streakDisplay"></div>
    <div id="questionArea">
      <div class="question-type-label" id="questionType"></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsArea"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultsScreen" class="results-screen"></div>

</div>

// ============================================================
// RANK SYSTEM
// ============================================================
const RANKS = [
  { title: "🧹 Glass Collector", minBadges: 0 },
  { title: "🍺 Tap Cadet", minBadges: 1 },
  { title: "🍸 Bartender", minBadges: 2 },
  { title: "⭐ Senior Bartender", minBadges: 3 },
  { title: "🔥 Shift Leader", minBadges: 4 },
  { title: "👑 Venue Supervisor", minBadges: 5 },
  { title: "🐕 Venue Legend", minBadges: 6 }
];

// ============================================================
// GAME STATE
// ============================================================
let state = loadState();

function defaultState() {
  return {
    totalPoints: 0,
    bestStreak: 0,
    badges: {},
    challengeHighScore: 0
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem('welders_challenge');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem('welders_challenge', JSON.stringify(state)); } catch(e) {}
}

function resetProgress() {
  if (confirm("Reset all your progress? This can't be undone!")) {
    state = defaultState();
    saveState();
    renderHome();
  }
}

// ============================================================
// QUIZ ENGINE
// ============================================================
let currentQuiz = null;

function startBadgeQuiz(badgeId) {
  const badge = BADGES.find(b => b.id === badgeId);
  if (!badge) return;

  const shuffled = shuffleArray([...badge.questions]);
  currentQuiz = {
    badgeId: badge.id,
    badgeName: badge.name,
    badgeIcon: badge.icon,
    questions: shuffled,
    currentIndex: 0,
    score: 0,
    streak: 0,
    maxStreak: 0,
    points: 0,
    isChallenge: false
  };
  showQuizScreen();
}

function startChallenge() {
  const allQs = [];
  BADGES.forEach(b => {
    b.questions.forEach(q => {
      allQs.push({ ...q, _badge: b.name });
    });
  });
  const shuffled = shuffleArray(allQs).slice(0, 10);
  currentQuiz = {
    badgeId: null,
    badgeName: "Random Challenge",
    badgeIcon: "⚡",
    questions: shuffled,
    currentIndex: 0,
    score: 0,
    streak: 0,
    maxStreak: 0,
    points: 0,
    isChallenge: true
  };
  showQuizScreen();
}

function showQuizScreen() {
  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  document.getElementById('quizBadgeName').textContent = currentQuiz.badgeIcon + ' ' + currentQuiz.badgeName;
  renderQuestion();
}

function renderQuestion() {
  const quiz = currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  const total = quiz.questions.length;

  document.getElementById('quizProgressText').textContent = (quiz.currentIndex + 1) + '/' + total;
  document.getElementById('quizProgressBar').style.width = ((quiz.currentIndex / total) * 100) + '%';

  // Streak
  const streakEl = document.getElementById('streakDisplay');
  if (quiz.streak >= 3) {
    streakEl.innerHTML = '<span class="hot">🔥 ' + quiz.streak + ' streak!</span>';
  } else if (quiz.streak > 0) {
    streakEl.innerHTML = '<span>✓ ' + quiz.streak + ' in a row</span>';
  } else {
    streakEl.innerHTML = '';
  }

  document.getElementById('questionType').textContent = q.type;
  document.getElementById('questionText').textContent = q.q;

  const optArea = document.getElementById('optionsArea');
  optArea.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optArea.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(index) {
  const quiz = currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  const correct = index === q.answer;

  // Disable all buttons
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    if (i === index && !correct) btn.classList.add('wrong');
  });

  // Update score
  if (correct) {
    quiz.score++;
    quiz.streak++;
    if (quiz.streak > quiz.maxStreak) quiz.maxStreak = quiz.streak;

    let pts = 10;
    if (quiz.streak >= 5) pts = 25;
    else if (quiz.streak >= 3) pts = 15;
    quiz.points += pts;

    showPointsPopup('+' + pts);
  } else {
    quiz.streak = 0;
  }

  // Streak update
  const streakEl = document.getElementById('streakDisplay');
  if (quiz.streak >= 3) {
    streakEl.innerHTML = '<span class="hot">🔥 ' + quiz.streak + ' streak!</span>';
  } else if (quiz.streak > 0) {
    streakEl.innerHTML = '<span>✓ ' + quiz.streak + ' in a row</span>';
  } else {
    streakEl.innerHTML = '';
  }

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (correct ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = (correct ? '✅ ' : '❌ ') + q.explanation;

  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  const quiz = currentQuiz;
  quiz.currentIndex++;
  if (quiz.currentIndex >= quiz.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quizScreen').classList.remove('active');

  const quiz = currentQuiz;
  const total = quiz.questions.length;
  const pct = Math.round((quiz.score / total) * 100);
  const passed = pct >= 70;
  const perfect = pct === 100;

  // Update global state
  state.totalPoints += quiz.points;
  if (quiz.maxStreak > state.bestStreak) state.bestStreak = quiz.maxStreak;

  let badgeUnlocked = false;
  if (!quiz.isChallenge && passed) {
    const prev = state.badges[quiz.badgeId];
    if (!prev || quiz.score > prev.bestScore) {
      state.badges[quiz.badgeId] = { bestScore: quiz.score, total: total, earnedAt: Date.now() };
    }
    if (!prev) badgeUnlocked = true;
  }
  if (quiz.isChallenge && quiz.score > state.challengeHighScore) {
    state.challengeHighScore = quiz.score;
  }
  saveState();

  // Build results HTML
  let icon = perfect ? '🏆' : passed ? '🎉' : '💪';
  let title = perfect ? 'PERFECT SCORE!' : passed ? 'Badge Earned!' : 'Not Quite...';
  let subtitle = perfect ? 'Absolute legend.' : passed ? 'Nice work — you know your stuff!' : 'You need 70% to earn this badge. Give it another crack!';

  if (quiz.isChallenge) {
    title = pct >= 80 ? 'Crushing It!' : pct >= 50 ? 'Solid Effort!' : 'Keep Practising!';
    subtitle = quiz.score + '/' + total + ' correct. Challenge high score: ' + state.challengeHighScore + '/10';
  }

  let html = '<div class="results-icon">' + icon + '</div>';
  html += '<div class="results-title">' + title + '</div>';
  html += '<div class="results-subtitle">' + subtitle + '</div>';
  html += '<div class="results-score">' + quiz.score + '/' + total + '</div>';
  html += '<div class="results-detail">' + quiz.points + ' points earned · Best streak: ' + quiz.maxStreak + '</div>';

  if (badgeUnlocked) {
    html += '<div class="badge-unlocked"><div class="badge-icon">' + quiz.badgeIcon + '</div><h3>' + quiz.badgeName + ' Unlocked!</h3></div>';
  }

  html += '<div class="result-btns">';
  if (!quiz.isChallenge) {
    html += '<button class="btn-retry" onclick="startBadgeQuiz(\'' + quiz.badgeId + '\')">Retry</button>';
  } else {
    html += '<button class="btn-retry" onclick="startChallenge()">Again</button>';
  }
  html += '<button class="btn-home" onclick="goHome()">Home</button>';
  html += '</div>';

  const screen = document.getElementById('resultsScreen');
  screen.innerHTML = html;
  screen.classList.add('active');
}

function goHome() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
  renderHome();
}

// ============================================================
// HOME SCREEN RENDERING
// ============================================================
function renderHome() {
  // Stats
  document.getElementById('totalPoints').textContent = state.totalPoints;
  const earnedCount = Object.keys(state.badges).length;
  document.getElementById('badgesEarned').textContent = earnedCount + '/' + BADGES.length;
  document.getElementById('bestStreak').textContent = state.bestStreak;

  // Rank
  let rank = RANKS[0];
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (earnedCount >= RANKS[i].minBadges) { rank = RANKS[i]; break; }
  }
  document.getElementById('rankTitle').textContent = rank.title;
  document.getElementById('rankFill').style.width = ((earnedCount / BADGES.length) * 100) + '%';

  // Badge grid
  const grid = document.getElementById('badgeGrid');
  grid.innerHTML = '';
  BADGES.forEach(badge => {
    const earned = !!state.badges[badge.id];
    const card = document.createElement('div');
    card.className = 'badge-card' + (earned ? ' earned' : '');
    card.onclick = () => startBadgeQuiz(badge.id);

    let scoreText = 'Tap to start';
    if (earned) {
      const b = state.badges[badge.id];
      scoreText = 'Best: ' + b.bestScore + '/' + b.total;
    }

    card.innerHTML = '<div class="badge-icon">' + badge.icon + '</div><div class="badge-name">' + badge.name + '</div><div class="badge-score">' + scoreText + '</div>';
    grid.appendChild(card);
  });
}

// ============================================================
// UTILS
// ============================================================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showPointsPopup(text) {
  const el = document.createElement('div');
  el.className = 'points-popup';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// Init
renderHome();
